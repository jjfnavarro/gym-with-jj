services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: gym
      POSTGRES_DB: gym
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - gym-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gym -d gym']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  gym-data:
